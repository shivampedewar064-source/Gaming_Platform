<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sudoku — HTML/CSS/JS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div class="app">
    <h1>Sudoku</h1>
    
    <div class="controls">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="40">Easy</option>
        <option value="50">Medium</option>
        <option value="55">Hard</option>
      </select>
      <button id="newBtn">New Game</button>
      <!-- <button id="solveBtn">Solve</button> -->
      <!-- <button id="checkBtn">Check</button> -->
      <div class="status" id="status">Ready</div>
    </div>

    <div class="grid-wrap">
      <div class="sudoku" id="sudoku"></div>
    </div>

    <!-- <div class="tools">
      <div class="note">Tip: type numbers 1–9. Use Backspace/Delete to clear.</div>
    </div>
    <footer>Simple Sudoku implemented with generator & solver (backtracking)</footer>
  </div> -->

  <script src="script.js"></script>
</body>
</html>
