    <div class="form">
    <span class="close_icon"><ion-icon name="close-outline"></ion-icon></span>
    <div class="box">
        <h2>Login</h2>
        <form action="#"> <!-- Corrected 'from' to 'form' -->
            <div class="input_box">
                <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
                <input type="email" placeholder="email" id="loginEmail" required> <!-- type="email" and id="loginEmail" -->
                <label>Email</label> <!-- Label changed to Email -->
            </div>
            <div class="input_box">
                <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span> <!-- Icon for password -->
                <input type="password" placeholder="password" id="loginPassword" required> <!-- id="loginPassword" -->
                <label>Password</label> <!-- Label changed to Password -->
            </div>
            <div class="remember">
                <label><input type="checkbox">Remember Me</label>
                <a href="#">Forgot Password? </a>
            </div>
            <button type="submit" class="btn" id="submitLogin">Login</button> <!-- id="submitLogin" -->
            <div class="sign_in">
                <p>Don't have an Account? <a href="#" class="register">Register</a></p>
            </div>
        </form>
    </div>

    <div class="regist">
        <h2>Registration</h2>
        <form action="#"> <!-- Corrected 'from' to 'form' -->
            <div class="input_box">
                <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
                <input type="text" id="registerUsername" placeholder="username" required> <!-- id="registerUsername" -->
                <label>Username</label>
            </div>
            <div class="input_box">
                <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>

                <label>Email</label>
            </div>
            <div class="input_box">
                <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                <input type="password" id="registerPassword" placeholder="password" required> <!-- id="registerPassword" -->
                <label>Password</label>
            </div>
            <div class="remember">
                <label><input type="checkbox">I filled in the information</label>
            </div>
            <button type="submit" class="btn" id="submitRegister">Register</button> <!-- id="submitRegister" -->
            <div class="sign_in">
                <p>I already have an Account. <a href="#" class="logine1">Login</a></p>
