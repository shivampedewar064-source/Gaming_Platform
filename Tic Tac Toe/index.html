<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>⭕ PLAYER 1 vs ❌ Ai</h1>
    <div class="container">
      <div class="game">
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <!-- glowing winner line -->
        <div id="line"></div>
        
      </div>
    </div>
    <div class="controls">
        <button class="reset">Reset Game</button>
      <div>
        <a href="../web developement/tic_tacinfo.html">    
          <button class="reset">Exit</button>
        </a> 
      </div>
    </div>
    <div class="msg-container hide">
      <p id="msg">Winner</p>
      <button class="newbtn">New Game</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
