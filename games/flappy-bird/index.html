<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Navigate the bird through obstacles by tapping or pressing Space."
    />
    <title>Flappy Bird | Gaming Platform</title>
    <link rel="icon" href="../../assets/images/favicon.ico" />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link rel="stylesheet" href="../../assets/css/games.css" />
    <link rel="stylesheet" href="./flappy-bird.css" />
  </head>
  <body class="game-page">
    <header class="game-header">
      <div class="brand">
        <img src="../../assets/images/logo.png" alt="Gaming Platform logo" />
        <div>
          <span class="brand__title">Gaming Platform</span>
          <span class="brand__tagline">Flappy Bird</span>
        </div>
      </div>
      <nav class="primary-nav">
        <a class="nav-link nav-link--ghost" href="../../index.html">Home</a>
        <a class="nav-link nav-link--ghost" href="../../pages/about.html">About</a>
        <button class="nav-link nav-link--ghost" data-logout data-show-when="signed-in" hidden>
          Logout
        </button>
        <a class="nav-link nav-link--primary" href="../../pages/login.html" data-show-when="signed-out"
          >Login</a
        >
      </nav>
    </header>

    <main class="game-layout">
      <section class="game-panel">
        <a class="back-link" href="../../index.html">&larr; Back to hub</a>
        <h1>Flappy Bird</h1>
        <div class="score-panel">
          <p>Score: <span id="score">0</span></p>
          <p>High score: <span id="highScore">0</span></p>
        </div>
        <p class="game-card__meta">Press Space or tap to flap. Avoid every pipe to climb the ranks.</p>
      </section>

      <section class="game-frame">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="game-over" id="gameOverScreen" hidden>
          <h2>Game over!</h2>
          <p>Final score: <span id="finalScore">0</span></p>
          <button class="btn btn-secondary" id="restartBtn">Restart game</button>
        </div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="../../assets/js/firebase-config.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="./flappy-bird.js"></script>
  </body>
</html>
