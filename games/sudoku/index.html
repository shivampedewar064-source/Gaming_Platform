<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Generate and solve Sudoku boards directly in the browser."
    />
    <title>Sudoku | Gaming Platform</title>
    <link rel="icon" href="../../assets/images/favicon.ico" />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link rel="stylesheet" href="../../assets/css/games.css" />
    <link rel="stylesheet" href="./sudoku.css" />
  </head>
  <body class="game-page">
    <header class="game-header">
      <div class="brand">
        <img src="../../assets/images/logo.png" alt="Gaming Platform logo" />
        <div>
          <span class="brand__title">Gaming Platform</span>
          <span class="brand__tagline">Sudoku</span>
        </div>
      </div>
      <nav class="primary-nav">
        <a class="nav-link nav-link--ghost" href="../../index.html">Home</a>
        <a class="nav-link nav-link--ghost" href="../../pages/about.html">About</a>
        <a class="nav-link nav-link--ghost" href="../../pages/login.html" data-show-when="signed-out"
          >Login</a
        >
        <button class="nav-link nav-link--ghost" data-logout data-show-when="signed-in" hidden>
          Logout
        </button>
      </nav>
    </header>

    <main class="game-layout">
      <section class="game-panel">
        <a class="back-link" href="../../index.html">&larr; Back to hub</a>
        <h1>Sudoku</h1>
        <p class="game-card__meta">
          Choose a difficulty, generate a board, and fill every square without repeating numbers.
        </p>
        <div class="controls">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="40">Easy</option>
            <option value="50">Medium</option>
            <option value="55">Hard</option>
          </select>
          <button class="btn btn-secondary" id="newBtn">New game</button>
        </div>
        <div class="status badge" id="status">Ready</div>
      </section>

      <section class="game-frame">
        <div class="grid-wrap">
          <div class="sudoku" id="sudoku"></div>
        </div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="../../assets/js/firebase-config.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="./sudoku.js"></script>
  </body>
</html>
