<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jump and duck your way through the endless Chrome Dinosaur runner."
    />
    <title>Chrome Dinosaur | Gaming Platform</title>
    <link rel="icon" href="../../assets/images/favicon.ico" />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link rel="stylesheet" href="../../assets/css/games.css" />
    <link rel="stylesheet" href="./chrome-dinosaur.css" />
  </head>
  <body class="game-page">
    <header class="game-header">
      <div class="brand">
        <img src="../../assets/images/logo.png" alt="Gaming Platform logo" />
        <div>
          <span class="brand__title">Gaming Platform</span>
          <span class="brand__tagline">Chrome Dinosaur</span>
        </div>
      </div>
      <nav class="primary-nav">
        <a class="nav-link nav-link--ghost" href="../../index.html">Home</a>
        <a class="nav-link nav-link--ghost" href="../../pages/about.html">About</a>
        <button class="nav-link nav-link--ghost" data-logout data-show-when="signed-in" hidden>
          Logout
        </button>
        <a class="nav-link nav-link--primary" href="../../pages/login.html" data-show-when="signed-out"
          >Login</a
        >
      </nav>
    </header>

    <main class="game-layout">
      <section class="game-panel">
        <a class="back-link" href="../../index.html">&larr; Back to hub</a>
        <h1>Chrome Dinosaur</h1>
        <p class="game-card__meta">
          Tap space or the up arrow to jump. Use down arrow to duck under the pterodactyls.
        </p>
      </section>

      <section class="game-frame">
        <canvas id="board"></canvas>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="../../assets/js/firebase-config.js"></script>
    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="./chrome-dinosaur.js"></script>
  </body>
</html>
