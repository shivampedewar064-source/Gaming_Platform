<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oggy Slide Puzzle Game</title>
  <link rel="stylesheet" href="style3.css">
  <script src="script3.js" defer></script>
</head>
<body>
  <h1>Oggy Slide Puzzle Game</h1>

  <div class="container">
    <!-- Puzzle board -->
    <div id="board"></div>

    <!-- Solution preview -->
    <div id="solution-box">
      <h3>Solution</h3>
      <img id="solution" src="../slide-puzzle-game/oggys_images/solution img.png" alt="Solution image">
    </div>
  </div>

  <h2>Turns: <span id="turns">0</span></h2>

  <!-- Buttons -->
  <div class="buttons">
    <button onclick="shuffleBoard()">Shuffle</button>
    <button onclick="resetBoard()">Reset</button>
    <a href="../forall/homepage.html">    
      <button>Exit</button>
    </a>  
  </div>
</body>
</html>
